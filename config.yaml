settings:
  daily_cap: 60                  # max posts per Cairo day
  max_posts_per_run: 3           # posts per hourly run
  max_age_hours: 12              # ignore news older than this
  quiet_hours_cairo: [1, 7]      # no posting from 01:00 to 06:59 Cairo time
  delay_between_posts_sec: [20, 60]
  gemini_model: gemini-2.5-flash
  gemini_fallback_model: gemini-2.5-flash-lite
  graph_version: v23.0           # check developers.facebook.com for the current version

# weight: higher = more trusted/important. region: intl | eg
# attach_link: false for Google News redirect links (Facebook previews them badly)
sources:
  # ---------- International (direct RSS) ----------
  - {name: BBC Sport, url: "https://feeds.bbci.co.uk/sport/football/rss.xml", weight: 5, region: intl, attach_link: true}
  - {name: Sky Sports, url: "https://www.skysports.com/rss/12040", weight: 5, region: intl, attach_link: true}
  - {name: The Guardian, url: "https://www.theguardian.com/football/rss", weight: 5, region: intl, attach_link: true}
  - {name: ESPN, url: "https://www.espn.com/espn/rss/soccer/news", weight: 4, region: intl, attach_link: true}
  - {name: Goal, url: "https://www.goal.com/feeds/en/news", weight: 4, region: intl, attach_link: true}
  - {name: Football Italia, url: "https://football-italia.net/feed/", weight: 3, region: intl, attach_link: true}

  # ---------- International (Google News aggregation, English) ----------
  - {name: GNews - Premier League, url: "https://news.google.com/rss/search?q=Premier+League+when:12h&hl=en&gl=US&ceid=US:en", weight: 4, region: intl, gnews: true, attach_link: false}
