# Always-covered topics: stories that mention these names are pushed to the top of the queue,
# and stories reported by many outlets at once ("buzz") are pushed up as well.
priority:
  star_boost: 1.5        # small nudge for a story that mentions a star below (not a takeover)
  star_window: 6         # look at the last 6 posts...
  star_max_in_window: 2  # ...and give no nudge when 2 of them were already star stories (keeps the page varied)
  buzz_sources: 3        # a story covered by at least this many different outlets...
  buzz_boost: 2          # ...gets this bonus
  statement_boost: 1.5   # coaches'/players' statements and press-conference stories get a nudge (they are what readers share)
  statement_patterns:    # regex, matched against the headline
    - '\b(says?|said|admits?|reveals?|insists?|warns?|slams?|hits? out|responds?|reacts?|explains?|defends?|confirms?|press conference|speaks?|opens up|breaks silence)\b'
    - 'تصريح|يصرح|يكشف|يؤكد|يعلق|يرد |يحذر|يوضح|يعترف|مؤتمر صحفي|يفتح النار|يتحدث|يبرر|يهاجم'
