# The daily "today's matches" post: a short caption + a CARD listing the important matches with kick-off times.
# Data: ESPN public scoreboard (unofficial; test with the check_fixtures run - it prints every match found and marks + selected / - dropped).
# Per league:  teams = only matches involving these clubs (both: true = both sides must be listed)
#              max = cap per league, featured = clubs that win a place when there are more matches than max
#              (no teams/max = every match of that league)
fixtures:
  enabled: true
  hour_cairo: 10              # the post goes out at the first run at/after 10:00 Cairo (runs are every 10 minutes)
  give_up_hour_cairo: 17      # if no match data by then, skip the post for today
  rows_per_card: 9            # matches per card; a busy day becomes 2-3 cards inside ONE post (album)
  max_cards: 3
  max_matches: 27             # hard cap on all matches of the day (= 3 cards x 9 rows)
  # Data sources, in priority order. For every league the first source that returns matches wins, so a blocked source
  # (ESPN answers 403 to GitHub's servers at times) never stops the post. Run check_fixtures to see which source served what.
  #   espn          no key (unofficial)
  #   sofascore     no key (unofficial) - covers every league incl. Egypt, Saudi and CAF
  #   footballdata  free key from football-data.org -> secret FOOTBALL_DATA_KEY (top-5 leagues + Champions League); skipped without a key
  #   thesportsdb   free test key built in (optional own key in secret THESPORTSDB_KEY)
  sources: [espn, sofascore, footballdata, thesportsdb]
  leagues:                    # order = display order on the card
    - {code: uefa.champions, name: "دوري أبطال أوروبا", teams: [Real Madrid, Barcelona, Atletico, Bayern, Paris Saint-Germain, Inter, Milan, Juventus, Napoli, Manchester City, Liverpool, Arsenal, Chelsea, Manchester United, Tottenham, Newcastle, Aston Villa]}
    - {code: eng.1, name: "الدوري الإنجليزي الممتاز"}   # every match
    - {code: esp.1, name: "الدوري الإسباني", teams: [Real Madrid, Barcelona, Atletico]}
    - {code: ita.1, name: "الدوري الإيطالي", teams: [Inter, Milan, Juventus, Napoli]}   # top 4; add/remove names for top 3/5
    - {code: ger.1, name: "الدوري الألماني", teams: [Bayern]}
    - {code: fra.1, name: "الدوري الفرنسي", teams: [Paris Saint-Germain]}
    - {code: egy.1, name: "الدوري المصري الممتاز", teams: [Al Ahly, Zamalek, Pyramids]}
    - {code: ksa.1, name: "دوري روشن السعودي", teams: [Al Nassr, Al Hilal]}
    - {code: caf.champions, name: "دوري أبطال إفريقيا", teams: [Al Ahly, Zamalek, Pyramids]}
    - {code: caf.confed, name: "كأس الكونفدرالية الإفريقية", teams: [Al Ahly, Zamalek, Pyramids]}
    - {code: uefa.europa, name: "الدوري الأوروبي", max: 3, featured: [Manchester United, Tottenham, Roma, Atletico, Real Betis, Porto, Ajax, Lazio, Aston Villa]}
    - {code: eng.league_cup, name: "كأس الرابطة الإنجليزية", max: 3, featured: [Manchester United, Manchester City, Liverpool, Arsenal, Chelsea, Tottenham]}
    - {code: eng.fa, name: "كأس الاتحاد الإنجليزي", max: 3, featured: [Manchester United, Manchester City, Liverpool, Arsenal, Chelsea, Tottenham]}
    - {code: esp.copa_del_rey, name: "كأس ملك إسبانيا", teams: [Real Madrid, Barcelona, Atletico]}
    - {code: usa.1, name: "الدوري الأمريكي", teams: [Inter Miami]}
    - {code: fifa.world, name: "كأس العالم", max: 6}
    - {code: uefa.nations, name: "دوري الأمم الأوروبية", max: 4, featured: [France, Spain, England, Germany, Portugal, Italy]}
    - {code: fifa.worldq.caf, name: "تصفيات كأس العالم - إفريقيا", max: 4, featured: [Egypt, Morocco, Senegal, Algeria, Nigeria]}
    - {code: fifa.worldq.uefa, name: "تصفيات كأس العالم - أوروبا", max: 4, featured: [France, Spain, England, Germany, Portugal, Italy]}
    - {code: fifa.friendly, name: "مباريات ودية دولية", max: 4, featured: [Egypt, Brazil, Argentina, France, Spain, England, Portugal, Morocco]}

# Photos come from Wikimedia Commons (CC0 / public domain / CC BY / CC BY-SA only); the fallback is a headline card
images:
  cards_only: true                  # true = every post gets a headline card (6 designs, never the same one twice in a row) and photos are never searched
  enabled: true
  no_image_policy: card              # card = when no suitable real photo exists, post a headline card; skip = don't publish; text = text only
  archive_label: true                # adds "صورة أرشيفية" to the photo line so readers don't think the photo is from the event (not used on cards)
  allow_attribution_licenses: true   # CC BY / CC BY-SA photos need a one-line photo credit; false = only public domain / CC0 (very few photos)
  vision_check: true                 # Gemini checks the shirt colours/crest and photo quality (it never identifies anyone by face)
  vision_candidates: 3
  max_specs: 3                       # how many image subjects (player / match / team / stadium / competition) to try per story
  min_width: 900

# weight: higher = more trusted/important. region: intl | eg
# attach_link: false for Google News redirect links (Facebook previews them badly)
