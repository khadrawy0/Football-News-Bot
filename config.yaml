settings:
  daily_cap: 60                  # max posts per Cairo day
  max_posts_per_run: 1           # one new story per run (runs happen every 10 minutes)
  max_age_hours: 12              # ignore news older than this
  quiet_hours_cairo: [0, 9]      # no posting from 00:00 to 08:59 Cairo time (keep the same window in the cron-job.org schedule)
  delay_between_posts_sec: [20, 60]
  # models are tried in this order; for each model every key is tried. Quota is per Google project AND per model,
  # so more models + keys from different projects = more free daily calls.
  gemini_models: [gemini-flash-latest, gemini-flash-lite-latest]   # then the newest flash models the API lists for the key (auto-discovered)
  gemini_auto_discover: true
  gemini_model: gemini-2.5-flash
  gemini_fallback_model: gemini-2.5-flash-lite
  graph_version: v23.0           # check developers.facebook.com for the current version

  candidate_pool: 12             # stories whose full article we try to fetch each run
  min_article_chars: 350         # skip stories whose article text is shorter (paywall / blocked)
  min_post_chars: 200            # a post must be at least this long (it is the full news)

  # Titles matching any regex are dropped (live blogs, streaming/TV listings)
  skip_title_patterns:
    - '(?i)(^|[–\-|:])\s*live\b'
    - '(?i)\blive (blog|updates|score|stream|coverage|text)'
    - 'بث مباشر'
    - 'مشاهدة'
    - 'القنوات الناقلة'
    - 'لايف'
    - '(?i)\bLIVE[!:]'
    - '(?i)\b(NFL|NBA|MLB|NHL|UFC|WWE|F1|Formula 1|cricket|rugby)\b'

  # Google News items are posted only if their publisher is listed here
  # (matched at the start of the publisher name, case-insensitive).
  # The run log prints "dropped (publisher not trusted)" so you can add good ones.
  trusted_publishers:
