# Writing styles (all in formal Modern Standard Arabic); one is assigned per post (w = how often)
styles:
  - {w: 3, name: "رسمي إخباري", desc: "نبرة نشرة أخبار رصينة بالفصحى المبسطة، جملة افتتاحية قوية ومباشرة"}
  - {w: 3, name: "حماسي بالفصحى", desc: "فصحى مبسطة بنبرة حماسية وإيقاع سريع كأنه معلق رياضي، دون أي كلمة عامية"}
  - {w: 3, name: "خبر ثم سؤال للجمهور", desc: "الخبر في سطرين بالفصحى، ثم سؤال ذكي موجّه للجمهور لتشجيع التعليقات"}
  - {w: 2, name: "موجز تحليلي", desc: "الخبر بنبرة رصينة، ثم دلالته أو سياقه بشرط أن يكون مذكورًا في المصدر نفسه"}
  - {w: 2, name: "عنوان جذاب ثم التفاصيل", desc: "سطر أول جذاب غير مضلل يشد الانتباه، ثم التفاصيل الحقيقية للخبر بالفصحى"}
