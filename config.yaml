# Writing styles (all formal Modern Standard Arabic, always the FULL news); one per post (w = how often)
styles:
  - {w: 3, name: "رسمي إخباري", desc: "نبرة نشرة أخبار رصينة بالفصحى المبسطة، جملة افتتاحية قوية ومباشرة ثم الخبر كاملًا"}
  - {w: 3, name: "حماسي بالفصحى", desc: "فصحى مبسطة بنبرة حماسية وإيقاع سريع كأنه معلق رياضي، دون أي كلمة عامية، والخبر كامل"}
  - {w: 2, name: "الخبر كاملًا ثم سؤال", desc: "الخبر كاملًا بالفصحى، وفي آخره سؤال ذكي موجّه للجمهور في سطر مستقل لتشجيع التعليقات"}
  - {w: 2, name: "موجز تحليلي", desc: "الخبر كاملًا بنبرة رصينة، ثم سياقه أو دلالته بشرط أن يكون مذكورًا في المقال نفسه"}
  - {w: 2, name: "عنوان جذاب ثم التفاصيل", desc: "سطر أول جذاب غير مضلل يشد الانتباه، ثم تفاصيل الخبر كاملة بالفصحى"}
