# with symbols); one per post (w = how often)
styles:
  - {w: 3, name: "نشرة رسمية", desc: "عنوان إخباري رصين ثم فقرات قصيرة بنبرة نشرة أخبار بالفصحى المبسطة، والخبر كاملًا"}
  - {w: 3, name: "حماسي بالفصحى", desc: "عنوان حماسي وإيقاع سريع كأنه معلق رياضي، فصحى مبسطة بلا أي كلمة عامية، والخبر كامل في فقرات قصيرة"}
  - {w: 3, name: "تصريح في الواجهة", desc: "إن تضمن المقال تصريحًا لمدرب أو لاعب فالعنوان يلخص التصريح، ثم أهم عباراته بين «» مع اسم قائلها وصفته، ثم باقي الخبر؛ وإن لم يتضمن تصريحًا فاكتب بنبرة نشرة رسمية"}
  - {w: 2, name: "نقاط سريعة", desc: "عنوان قوي ثم من 3 إلى 5 نقاط قصيرة، كل نقطة في سطر مستقل تبدأ برمز، تغطي الخبر كاملًا"}
  - {w: 2, name: "الخبر ثم سؤال", desc: "عنوان وفقرات الخبر كاملًا، وفي آخره سطر مستقل بسؤال ذكي موجّه للجمهور المصري لتشجيع التعليقات"}
  - {w: 2, name: "موجز تحليلي", desc: "عنوان وفقرات الخبر كاملًا بنبرة رصينة، ثم فقرة أخيرة عن سياقه أو دلالته بشرط أن يكون مذكورًا في المقال نفسه"}
