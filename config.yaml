# The daily "today's matches" post: a short caption + a CARD listing the important matches with kick-off times.
# Data: ESPN public scoreboard (unofficial; test with the check_fixtures run - it prints every match found and marks + selected / - dropped).
# Per league:  teams = only matches involving these clubs (both: true = both sides must be listed)
#              max = cap per league, featured = clubs that win a place when there are more matches than max
#              (no teams/max = every match of that league)
fixtures:
  enabled: true
  hour_cairo: 10              # the post goes out at the first run at/after 10:00 Cairo (runs are every 10 minutes)
  give_up_hour_cairo: 17      # if no match data by then, skip the post for today
  rows_per_card: 11           # capacity of one 4:5 card in rows (a match = 1, a competition heading = 1.15)
  max_cards: 3                # a busy day becomes 2-3 cards inside ONE post (album)
  max_matches: 32             # hard cap on all matches of the day (the leagues listed first win)
  # Data sources, in priority order. For every league the first source that returns matches wins, so a blocked source
  # (ESPN answers 403 to GitHub's servers at times) never stops the post. Run check_fixtures to see which source served what.
  #   espn          no key (unofficial)
  #   sofascore     no key (unofficial) - covers every league incl. Egypt, Saudi, Turkey and CAF
  #   footballdata  free key from football-data.org -> secret FOOTBALL_DATA_KEY (top-5 leagues + Champions League); skipped without a key
  #   thesportsdb   free test key built in (optional own key in secret THESPORTSDB_KEY)
  sources: [espn, sofascore, footballdata, thesportsdb]
  # Matches of these clubs get a gold-tinted row on the cards (the matches your audience waits for most)
  highlight: [Al Ahly, Zamalek, Pyramids, Trabzonspor, Real Madrid, Barcelona, Liverpool, Manchester City, Bayern, Paris Saint-Germain, Al Nassr, Al Hilal]
  # "important matches" = only matches of the clubs listed per league (no teams list = every match of that league).
  # Order = display order on the cards. Names are matched as text inside the club name (case/accents ignored).
  leagues:
    - {code: uefa.champions, name: "دوري أبطال أوروبا", teams: [Real Madrid, Barcelona, Atletico, Bayern, Borussia Dortmund, Paris Saint-Germain, Marseille, Inter, Milan, Juventus, Napoli, Roma, Manchester City, Liverpool, Arsenal, Chelsea, Manchester United, Tottenham, Newcastle, Aston Villa, Benfica, Porto, Sporting CP, Galatasaray, Ajax]}
    - {code: uefa.europa, name: "الدوري الأوروبي", max: 4, featured: [Trabzonspor], teams: [Trabzonspor, Galatasaray, Fenerbahce, Besiktas, Manchester United, Tottenham, Roma, Lazio, Atletico, Real Betis, Porto, Ajax, Aston Villa]}
    - {code: egy.1, name: "الدوري المصري الممتاز", teams: [Al Ahly, Zamalek, Pyramids, Al Masry, Ismaily, Al Ittihad]}
    - {code: caf.champions, name: "دوري أبطال إفريقيا", teams: [Al Ahly, Zamalek, Pyramids]}
    - {code: caf.confed, name: "كأس الكونفدرالية الإفريقية", teams: [Al Ahly, Zamalek, Pyramids, Al Masry]}
    - {code: tur.1, name: "الدوري التركي", teams: [Trabzonspor, Galatasaray, Fenerbahce, Besiktas]}   # Salah plays for Trabzonspor
    - {code: eng.1, name: "الدوري الإنجليزي الممتاز"}   # every match
    - {code: esp.1, name: "الدوري الإسباني", teams: [Real Madrid, Barcelona, Atletico, Sevilla, Valencia]}
    - {code: ita.1, name: "الدوري الإيطالي", teams: [Inter, Milan, Juventus, Napoli, Roma]}
    - {code: ger.1, name: "الدوري الألماني", teams: [Bayern, Borussia Dortmund]}
    - {code: fra.1, name: "الدوري الفرنسي", teams: [Paris Saint-Germain, Marseille]}
    - {code: ksa.1, name: "دوري روشن السعودي", teams: [Al Nassr, Al Hilal, Al Ittihad, Al Ahli]}
    - {code: por.1, name: "الدوري البرتغالي", teams: [Benfica, Porto, Sporting CP]}
    - {code: ned.1, name: "الدوري الهولندي", teams: [Ajax]}
    - {code: eng.league_cup, name: "كأس الرابطة الإنجليزية", max: 3, featured: [Manchester United, Manchester City, Liverpool, Arsenal, Chelsea, Tottenham]}
    - {code: eng.fa, name: "كأس الاتحاد الإنجليزي", max: 3, featured: [Manchester United, Manchester City, Liverpool, Arsenal, Chelsea, Tottenham]}
    - {code: esp.copa_del_rey, name: "كأس ملك إسبانيا", teams: [Real Madrid, Barcelona, Atletico]}
    - {code: usa.1, name: "الدوري الأمريكي", teams: [Inter Miami]}
    - {code: fifa.world, name: "كأس العالم", max: 6}
    - {code: caf.nations, name: "كأس الأمم الإفريقية", max: 4, featured: [Egypt, Morocco, Senegal, Algeria, Nigeria, Ivory Coast]}
    - {code: uefa.nations, name: "دوري الأمم الأوروبية", max: 4, featured: [France, Spain, England, Germany, Portugal, Italy]}
    - {code: fifa.worldq.caf, name: "تصفيات كأس العالم - إفريقيا", max: 4, featured: [Egypt, Morocco, Senegal, Algeria, Nigeria]}
    - {code: fifa.worldq.uefa, name: "تصفيات كأس العالم - أوروبا", max: 4, featured: [France, Spain, England, Germany, Portugal, Italy]}
    - {code: fifa.friendly, name: "مباريات ودية دولية", max: 4, featured: [Egypt, Brazil, Argentina, France, Spain, England, Portugal, Morocco]}

# Photos come from Wikimedia Commons (CC0 / public domain / CC BY / CC BY-SA only); the fallback is a headline card
images:
  card_sizes: {portrait: 3, landscape: 2}   # headline cards: portrait = big 4:5 (1080x1350), landscape = classic (1200x630); numbers = how often. Never the same size 3 times in a row
  photo_share: 0.8                  # target share of posts with a real photo (70-80% wanted); the rest = headline cards. Photos not found fall back to a card, the bot corrects itself over the last 20 posts
  cards_only: false                 # true = every post gets a headline card (6 designs...) and no photo is used at all; false = real photos (see article_images)
  # The photo of every post = the lead photo of the source article. Needs cards_only: false.
  article_images:
    enabled: true
    fallback: card             # when the article has no usable photo: card = headline card | commons = stock-photo search (the older method below) | skip = don't publish the story
    credit: true               # last line of the post: 📷 الصورة: <publisher>
    credit_prefix: "الصورة:"
    skip_agencies: true        # skip photos credited to Getty / Reuters / AP / AFP / PA / Shutterstock / Alamy ... (the agencies that enforce their rights; most big outlets use them)
    verify: true               # Gemini vision checks each photo fits the story (football, no other sport/ad/watermark); never identifies faces. A quota failure accepts the photo
    max_age_days: 21           # skip photos whose URL carries an older /YYYY/MM/ date (stale archive photos)
    skip_hosts: [ichef.bbci.co.uk, e0.365dm.com, townnews.com, gannett-cdn.com]             # image hosts to never use, e.g. [ichef.bbci.co.uk, e0.365dm.com] = BBC and Sky photos (the page-level agency check cannot see credits that are not in the page markup)
    brand_mark: true           # small "شيكس" badge in the corner of the photo
    min_width: 700             # Arabic sites publish their lead photo at 750x450
    min_height: 400
    max_side: 1600
    max_candidates: 6
    other_outlets: 5           # no usable photo at the lead outlet -> try the photos of up to 5 other outlets covering the SAME story
    search_other_outlets: true # find those outlets by searching Google News with the headline's key words (the feeds alone rarely list a 2nd outlet)
  enabled: true
  no_image_policy: card              # card = when no suitable real photo exists, post a headline card; skip = don't publish; text = text only
  archive_label: true                # adds "صورة أرشيفية" to the photo line so readers don't think the photo is from the event (not used on cards)
  allow_attribution_licenses: true   # CC BY / CC BY-SA photos need a one-line photo credit; false = only public domain / CC0 (very few photos)
  vision_check: true                 # Gemini checks the shirt colours/crest and photo quality (it never identifies anyone by face)
  vision_candidates: 3
  max_specs: 3                       # how many image subjects (player / match / team / stadium / competition) to try per story
  min_width: 900

