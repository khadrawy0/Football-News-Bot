# Writing styles; one is assigned randomly to every post (weight = how often)
styles:
  - {w: 3, name: "رسمي إخباري", desc: "نبرة نشرة أخبار رسمية بالعربية الفصحى المبسطة، جملة افتتاحية قوية ومباشرة"}
  - {w: 4, name: "عامية مصرية حماسية", desc: "عامية مصرية حماسية زي معلق شاطر، طاقة عالية وكلمات مصرية طبيعية من غير مبالغة"}
  - {w: 3, name: "عامية مصرية بسؤال تفاعلي", desc: "عامية مصرية، الخبر في سطرين وبعدها سؤال ذكي للجمهور يحمّسهم يردوا في الكومنتات"}
  - {w: 2, name: "عامية مصرية خفيفة الدم", desc: "عامية مصرية بخفة دم وتعليق ساخر لطيف، من غير إساءة لأي لاعب أو نادي أو جمهور"}
  - {w: 2, name: "عنوان صادم ثم التفاصيل", desc: "سطر أول جذاب يشد الانتباه (من غير تضليل)، وبعده التفاصيل الحقيقية للخبر"}
