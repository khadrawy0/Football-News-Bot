name: post-football-news

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05 (the script itself skips quiet hours)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print posts, do not publish)"
        type: boolean
        default: true
      check_feeds:
        description: "Only test the feeds"
        type: boolean
        default: false
      check_token:
        description: "Only check whose Facebook token this is (no posting)"
        type: boolean
        default: false

concurrency:
  group: poster
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check feeds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_feeds }}
        run: python main.py --check

      - name: Check Facebook token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_token }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python main.py --check-token

      - name: Generate and post
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.check_feeds || inputs.check_token)) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python main.py

      - name: Save state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.check_feeds || inputs.check_token)) }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || (git commit -m "chore: update bot state" && git push)
